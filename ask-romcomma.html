<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    <link href="https://fonts.googleapis.com/css2?family=Xanh+Mono:ital@0;1&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ask romcomma - Screenshot Scents</title>
    <style>
        /* page colors: swap these to try a paper version
           (e.g. --paper: #f3e6e2; --ink: #111111;) */
        :root {
            --paper: #000000;
            --ink: #ffffff;
            --muted: #999999;
            --serif: 'Xanh Mono', 'Courier New', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--paper);
            color: var(--ink);
            font-family: 'Xanh Mono', 'Courier New', monospace;
            font-weight: normal;
            padding: 40px 16px 80px;
            max-width: 1000px;
            margin: 0 auto;
            line-height: 1.0;
        }

        /* header: same as index.html and mixtapes.html (stays white, doesn't flush) */
        header {
            text-align: left;
            margin-bottom: 50px;
            padding-bottom: 30px;
            color: #ffffff;
        }
        .logo-image {
            height: 120px;
            display: block;
            margin-bottom: 20px;
            animation: screenshotFlash 11s ease-in-out infinite;
        }
        @keyframes screenshotFlash {
            0%, 93% { opacity: 1; }
            94% { opacity: 0.05; }
            95% { opacity: 0.3; }
            96% { opacity: 0.7; }
            97% { opacity: 1; }
            100% { opacity: 1; }
        }
        #datetime { font-size: 1.1em; margin-bottom: 10px; }
        #current-time { font-size: 1.1em; color: #ccc; }
        #last-online {
            font-size: 0.9em;
            color: #999;
            margin-top: 10px;
            font-style: italic;
        }
        #last-online:empty { display: none; }
        #headerLinks { display: flex; gap: 15px; margin-top: 10px; }
        #headerLinks a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: normal;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        #headerLinks a.hidden { display: none; }
        .email-reveal {
            font-size: 1.1em;
            color: #ffffff;
            white-space: nowrap;
            display: inline;
            opacity: 0;
            animation: fadeIn 0.8s ease-in forwards;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* dog nose cursor (same as index.html) */
        @media (hover: hover) and (pointer: fine) {
            *:not(a):not(textarea):not(input) { cursor: none; }
        }
        #custom-cursor {
            position: fixed;
            width: 40px;
            height: 40px;
            background-image: url('dog_nose_white.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            pointer-events: none;
            z-index: 10002;
            transition: opacity 0.5s ease;
            opacity: 0.3;
            display: none;
            filter: blur(1px);
        }
        #custom-cursor.hidden { opacity: 0; }
        @media (hover: hover) and (pointer: fine) {
            #custom-cursor { display: block; }
        }

        /* ---------- the problem page ---------- */

        .masthead, .masthead-sub { text-align: center; }
        .masthead {
            font-weight: normal;
            font-size: 1.2em;
            letter-spacing: 0.02em;
            line-height: 1.2;
        }
        .masthead-sub {
            font-style: italic;
            font-size: 0.9em;
            color: #999;
            margin-top: 6px;
        }

        /* the intro box, with the question box inside it */
        .intro {
            border: 1px solid currentColor;   /* the box's line flushes along with the text */
            padding: 16px 18px 14px;
            margin: 22px 0 34px;
            font-family: var(--serif);
            font-size: 1.1em;
            line-height: 1.35;
        }
        .intro a { color: inherit; font-weight: normal; text-decoration: none; }

        /* the ask box: one plain box and one gray button, like an old search page */
        .ask-box {
            margin-top: 18px;
            text-align: center;
        }
        .ask-box input#askQuestion {
            display: block;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 4px 6px;
            background: #ffffff;
            color: #000000;
            font-family: 'Xanh Mono', 'Courier New', monospace;
            font-size: 16px;
            border: 1px solid;
            border-color: #7a7a7a #c0c0c0 #c0c0c0 #7a7a7a;
            border-radius: 0;
            outline: none;
            cursor: text;
            transition: background-color 0.5s ease-out, border-color 0.5s ease-out;
        }
        /* once they stop typing, the blush fades away slowly */
        .ask-box input#askQuestion.cooling {
            transition: background-color 2.5s ease-in-out, border-color 2.5s ease-in-out;
        }
        .ask-box button {
            margin-top: 10px;
            padding: 3px 12px;
            background: #dddddd;
            color: #000000;
            font-family: 'Xanh Mono', 'Courier New', monospace;
            font-size: 13px;
            border: 2px outset #eeeeee;
            border-radius: 0;
            cursor: pointer;
        }
        .ask-box button:active { border-style: inset; }
        .ask-box .hp { position: absolute; left: -9999px; }
        .ask-status {
            display: block;
            min-height: 1.3em;
            margin-top: 8px;
            font-family: 'Xanh Mono', 'Courier New', monospace;
            font-size: 13px;
            color: var(--muted);
        }

        /* the letters, flowing in columns like a magazine page */
        .letters {
            column-count: 3;
            column-gap: 26px;
        }
        @media (max-width: 860px) { .letters { column-count: 2; } }
        @media (max-width: 600px) { .letters { column-count: 1; } }

        .entry {
            break-inside: avoid;
            margin-bottom: 30px;
            font-family: var(--serif);
            font-size: 1.05em;
            line-height: 1.35;
        }

        /* headline blocks: fixed, white with black type */
        .headline {
            display: block;
            font-family: 'Xanh Mono', 'Courier New', monospace;
            font-weight: normal;
            font-size: 1em;   /* same size as the letters and replies */
            letter-spacing: 0.03em;
            line-height: 1.05;
            color: #000000;
            padding: 7px 9px 6px;
            margin-bottom: 10px;
            background-color: #ffffff;
        }

        /* like a nervous flush: each rush of blood arrives fast,
           then drains away slowly; the rushes come closer and stronger,
           a few heartbeats flicker at the peak, then a long fade */
        /* the text flushes like a nervous rush of blood: each rush arrives
           fast and drains slowly, the rushes come closer and stronger, a few
           heartbeats at the peak, then a long fade back to white.
           (headline blocks, grays, and the ask box keep their own colors) */
        body { animation: textFlush 10s infinite; }
        @keyframes textFlush {
            0%   { color: #ffffff; animation-timing-function: ease-in-out; }
            20%  { color: #ffffff; animation-timing-function: cubic-bezier(0.15, 0.85, 0.3, 1); }
            25%  { color: #f8e1e5; animation-timing-function: cubic-bezier(0.45, 0, 0.55, 1); }
            38%  { color: #fefafb; animation-timing-function: cubic-bezier(0.15, 0.85, 0.3, 1); }
            43%  { color: #f2c8d0; animation-timing-function: cubic-bezier(0.45, 0, 0.55, 1); }
            53%  { color: #fbeef1; animation-timing-function: cubic-bezier(0.15, 0.85, 0.3, 1); }
            58%  { color: #ecadb9; animation-timing-function: cubic-bezier(0.45, 0, 0.55, 1); }
            66%  { color: #f4d2d9; animation-timing-function: cubic-bezier(0.15, 0.85, 0.3, 1); }
            74%  { color: #e0899a; animation-timing-function: ease-in-out; }
            76%  { color: #e598a7; animation-timing-function: cubic-bezier(0.15, 0.85, 0.3, 1); }
            78%  { color: #e0899a; animation-timing-function: ease-in-out; }
            80%  { color: #e496a5; animation-timing-function: cubic-bezier(0.15, 0.85, 0.3, 1); }
            82%  { color: #e18e9e; animation-timing-function: cubic-bezier(0.45, 0, 0.55, 1); }
            100% { color: #ffffff; }
        }
        @media (prefers-reduced-motion: reduce) { body { animation: none; } }

        .letter p + p, .reply p + p { margin-top: 0.7em; }
        .signed {
            display: block;
            margin-top: 6px;
            text-align: right;
            font-family: 'Xanh Mono', 'Courier New', monospace;
            font-weight: normal;
            font-size: 0.8em;
            letter-spacing: 0.08em;
        }
        .reply { margin-top: 12px; }
        .reply .signed { margin-top: 8px; }

        .sample-note {
            font-family: 'Xanh Mono', 'Courier New', monospace;
            font-size: 0.8em;
            color: var(--muted);
            margin-bottom: 18px;
        }

        /* about (same as index.html) */
        .about-link {
            position: fixed;
            bottom: 20px; right: 20px;
            font-size: 1.1em;
            font-family: 'Xanh Mono', 'Courier New', monospace;
            font-weight: normal;
            color: var(--ink);
            text-decoration: none;
            cursor: pointer;
            z-index: 1000;
        }
        .about-link.hidden { display: none; }
        .about-text {
            position: fixed;
            bottom: 20px; right: 20px;
            font-family: 'Xanh Mono', 'Courier New', monospace;
            font-weight: normal;
            font-size: 1.1em;
            color: var(--ink);
            z-index: 10000;
            text-align: right;
            white-space: nowrap;
        }
        .misting { animation: mistOut 4s ease-out forwards; }
        @keyframes mistOut {
            0% { opacity: 1; filter: blur(0px); }
            50% { opacity: 0.5; filter: blur(1px); }
            100% { opacity: 0; filter: blur(3px); }
        }

        /* bold for the email and the headline blocks.
           xanh mono has no bold of its own, so instead of letting the browser
           smear the letters, this traces each letter with a thin outline in its
           own color, which thickens it cleanly */
        .intro a,
        .headline {
            -webkit-text-stroke: 0.03em currentColor;
            paint-order: stroke fill;
        }
    </style>
</head>
<body>
    <div id="custom-cursor"></div>
    <a href="#" class="about-link" id="aboutLink">about</a>

    <header>
        <a href="/"><img src="screenshot_scents_text.png" alt="Screenshot Scents" class="logo-image"></a>
        <div><span id="datetime"></span> <span id="current-time"></span> <span id="moonSymbol"></span></div>
        <div id="last-online"></div>
        <div id="headerLinks">
            <a href="index.html">blog</a>
            <a href="mixtapes.html">mixtapes</a>
            <a id="emailLink">contact</a>
        </div>
    </header>

    <main>
        <div class="masthead">ask romcomma</div>
        <div class="masthead-sub">love, sex, and the senses</div>

        <div class="intro">
            if you're stuck with something tender, embarrassing, or just plain horny, drop romcomma a line. ask anonymously below, or write to <a id="askEmail" href="#">ask [at] screenshotscents.com</a>. romcomma reads every letter and answers a few each week.

            <form class="ask-box" id="askForm" autocomplete="off">
                <input type="text" id="askQuestion" maxlength="1000" aria-label="your question" required>
                <input type="text" id="askWebsite" class="hp" tabindex="-1" aria-hidden="true">
                <button type="submit" id="askSend">ask romcomma</button>
                <span class="ask-status" id="askStatus"></span>
            </form>
        </div>

        <div class="letters" id="entries"></div>
    </main>

    <script>
        // ask romcomma entries
        // add a new entry at the top of this list.
        // use \n\n to start a new paragraph. put a \ before any apostrophe (don\'t).
        //
        // {
        //     timestamp: '2026-11-19T21:00:00',
        //     headline: 'scent of a man',
        //     question: 'the reader\'s question',
        //     signed: 'their nickname',
        //     reply: 'first paragraph\n\nsecond paragraph'
        // },
        const entries = [
        ];

        // placeholder letters so you can see the layout.
        // set this to false before you share the page.
        const SHOW_SAMPLES = false;
        const samples = [
            {
                timestamp: '2026-11-12T21:40:00',
                headline: 'scent of a man',
                question: 'i asked him to send me a picture of the deodorant he uses. was that too much?',
                signed: 'nose first, silver lake',
                reply: 'sample reply. your words go here.'
            },
            {
                timestamp: '2026-11-10T20:00:00',
                headline: 'hoodie habits',
                question: 'is it weird that i smell his hoodie when he leaves the room and then pretend i was folding it?',
                signed: 'folding, echo park',
                reply: 'sample reply. your words go here.\n\na second paragraph, to show how longer answers flow down the column.'
            },
            {
                timestamp: '2026-11-08T20:00:00',
                headline: 'thanks but no thanks',
                question: 'how do i tell someone i like everything about them except how they kiss?',
                signed: 'lipless, highland park',
                reply: 'sample reply. your words go here.'
            }
        ];

        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        function addParagraphs(parent, text) {
            text.split('\n\n').forEach(par => parent.appendChild(el('p', '', par)));
        }

        const list = entries.length ? entries : (SHOW_SAMPLES ? samples : []);
        list.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        const container = document.getElementById('entries');
        if (!entries.length && SHOW_SAMPLES) {
            container.before(el('div', 'sample-note', '[sample letters, just to show the layout]'));
        }
        list.forEach(entry => {
            const article = el('article', 'entry');
            if (entry.headline) {
                article.appendChild(el('div', 'headline', entry.headline));
            }

            const letter = el('div', 'letter');
            addParagraphs(letter, entry.question);
            if (entry.signed) letter.appendChild(el('span', 'signed', entry.signed));
            article.appendChild(letter);

            const reply = el('div', 'reply');
            addParagraphs(reply, entry.reply);
            reply.appendChild(el('span', 'signed', 'romcomma'));
            article.appendChild(reply);

            container.appendChild(article);
        });

        // dog nose cursor + trail (same as index.html)
        const cursor = document.getElementById('custom-cursor');
        let cursorTimeout;
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX - 30 + 'px';
            cursor.style.top = e.clientY - 30 + 'px';
            cursor.classList.remove('hidden');

            const dot = document.createElement('div');
            dot.style.cssText = `position:fixed;left:${e.clientX-20}px;top:${e.clientY-20}px;width:40px;height:40px;background-image:url("dog_nose_white.png");background-size:contain;background-repeat:no-repeat;opacity:0.4;filter:blur(2px);pointer-events:none;z-index:10002;transition:opacity 0.8s ease,transform 0.8s ease;`;
            document.body.appendChild(dot);
            requestAnimationFrame(() => { dot.style.opacity = '0'; dot.style.transform = 'scale(1.5)'; });
            setTimeout(() => dot.remove(), 800);

            clearTimeout(cursorTimeout);
            cursorTimeout = setTimeout(() => cursor.classList.add('hidden'), 1000);
        });

        // about (same as index.html)
        const aboutLink = document.getElementById('aboutLink');
        let aboutClicked = false;
        aboutLink.addEventListener('click', (e) => {
            e.preventDefault();
            if (aboutClicked) return;
            aboutClicked = true;
            aboutLink.classList.add('hidden');
            const aboutText = document.createElement('div');
            aboutText.className = 'about-text';
            aboutText.style.borderRight = '2px solid white';
            document.body.appendChild(aboutText);
            const fullText = 'romcomma is a blogger who stops and reads nail polish names';
            let i = 0;
            const t = setInterval(() => {
                if (i < fullText.length) { aboutText.textContent = fullText.substring(0, ++i); }
                else {
                    clearInterval(t);
                    aboutText.style.borderRight = 'none';
                    setTimeout(() => {
                        aboutText.classList.add('misting');
                        setTimeout(() => aboutText.remove(), 4000);
                    }, 500);
                }
            }, 80);
        });

        // email link, put together here so spam bots can't scrape it from the page
        (function () {
            const user = 'ask', domain = 'screenshotscents.com';
            const link = document.getElementById('askEmail');
            link.href = 'mailto:' + user + '@' + domain;
            link.textContent = user + '@' + domain;
        })();

        // the anonymous question box
        // same script as the tester strips on index.html (questions go to a private tab)
        const ASK_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxQ4l46fvEUFX_CcfhXJ6QRQomfJ1DcomWv73K9DwNUjyvpHVQqdsNCCuFQYLf0PKCRtg/exec';

        const askForm = document.getElementById('askForm');
        const askStatus = document.getElementById('askStatus');
        const askSend = document.getElementById('askSend');
        const askQuestion = document.getElementById('askQuestion');
        let askSending = false;


        // the box blushes while someone types: every keystroke sends a little
        // rush of color, longer confessions keep it warmer, and when they
        // stop it slowly cools back to white
        const WHITE = [255, 255, 255];
        const BLUSH = [214, 112, 132];
        let heat = 0, pulse = 0, coolTimer = null, glowFrame = null;

        function paintBox() {
            const h = Math.min(1, heat + pulse);
            const mix = (i) => Math.round(WHITE[i] + (BLUSH[i] - WHITE[i]) * h);
            askQuestion.style.backgroundColor = `rgb(${mix(0)}, ${mix(1)}, ${mix(2)})`;
            askQuestion.style.borderColor = h > 0.05 ? `rgb(${mix(0) - 40}, ${mix(1) - 40}, ${mix(2) - 40})` : '';
        }

        function settle() {
            pulse *= 0.9;
            paintBox();
            if (pulse > 0.01) glowFrame = requestAnimationFrame(settle);
            else { pulse = 0; glowFrame = null; }
        }

        askQuestion.addEventListener('input', () => {
            askQuestion.classList.remove('cooling');
            heat = Math.min(0.75, askQuestion.value.length / 220);
            pulse = Math.min(0.35, pulse + 0.12);
            paintBox();
            if (!glowFrame) glowFrame = requestAnimationFrame(settle);
            clearTimeout(coolTimer);
            coolTimer = setTimeout(() => {
                askQuestion.classList.add('cooling');
                heat = 0; pulse = 0;
                paintBox();
            }, 1400);
        });

        function showStatus(text) {
            askStatus.classList.remove('misting');
            askStatus.textContent = text;
            void askStatus.offsetWidth;
            setTimeout(() => askStatus.classList.add('misting'), 2500);
        }

        askForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (askSending) return;
            const question = askQuestion.value.trim();
            const nickname = '';
            const honeypot = document.getElementById('askWebsite').value;
            if (!question || honeypot) return;

            askSending = true;
            askSend.textContent = 'sending…';
            try {
                await fetch(ASK_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ question, nickname })
                });
                askForm.reset();
                askQuestion.classList.add('cooling');
                heat = 0; pulse = 0; paintBox();
                showStatus('sent. romcomma will be reading 😏');
            } catch (err) {
                showStatus('that didn\'t go through, try again?');
            } finally {
                askSending = false;
                askSend.textContent = 'ask romcomma';
            }
        });
        // header: date, time, moon, last updated (same as index.html)
        function updateDateTime() {
            const now = new Date();
            document.getElementById('datetime').textContent = now.toLocaleDateString('en-US', {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });
            document.getElementById('current-time').textContent = now.toLocaleTimeString('en-US', {
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);

        function getMoonPhase(date) {
            const knownNewMoon = new Date(2000, 0, 6, 18, 14);
            const lunarCycle = 29.53058867;
            const diff = (date - knownNewMoon) / (1000 * 60 * 60 * 24);
            const phase = ((diff % lunarCycle) + lunarCycle) % lunarCycle;
            if (phase < 1.84566) return '●';
            if (phase < 5.53699) return '☽';
            if (phase < 9.22831) return '◐';
            if (phase < 12.91963) return '◑';
            if (phase < 16.61096) return '○';
            if (phase < 20.30228) return '◐';
            if (phase < 23.99361) return '◑';
            if (phase < 27.68493) return '☾';
            return '●';
        }
        function updateMoonSymbol() {
            document.getElementById('moonSymbol').textContent = getMoonPhase(new Date());
        }
        updateMoonSymbol();
        setInterval(updateMoonSymbol, 60000);

        // "last updated" follows the newest ask romcomma entry (hidden until there is one)
        (function () {
            if (!entries.length) return;
            const newest = entries.reduce((a, b) => new Date(a.timestamp) > new Date(b.timestamp) ? a : b);
            const postDate = new Date(newest.timestamp);
            const diffDays = Math.floor((new Date() - postDate) / (1000 * 60 * 60 * 24));
            const timeAgo = diffDays === 0 ? 'today' : diffDays === 1 ? '1 day ago' : `${diffDays} days ago`;
            const moonNames = {
                '●': 'a new moon', '☽': 'a waxing crescent', '◐': 'a first quarter moon',
                '◑': 'a waxing gibbous', '○': 'a full moon', '☾': 'a waning crescent'
            };
            document.getElementById('last-online').textContent =
                `last updated ${timeAgo}, under ${moonNames[getMoonPhase(postDate)] || 'the moon'}`;
        })();

        // contact (same as the other pages)
        const emailLink = document.getElementById('emailLink');
        let emailClicked = false;
        emailLink.addEventListener('click', (e) => {
            e.preventDefault();
            if (emailClicked) return;
            emailClicked = true;
            emailLink.classList.add('hidden');
            const emailText = document.createElement('span');
            emailText.className = 'email-reveal';
            emailText.textContent = 'sniff [at] screenshotscents.com';
            emailLink.insertAdjacentElement('afterend', emailText);
            setTimeout(() => {
                emailText.classList.add('misting');
                setTimeout(() => { emailText.remove(); emailClicked = false; emailLink.classList.remove('hidden'); }, 4000);
            }, 1500);
        });
    </script>
</body>
</html>
